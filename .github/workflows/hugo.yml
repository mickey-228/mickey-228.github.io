# 部署 Hugo 博客到 GitHub Pages 的自动化工作流
# 每次 push 到 main 分支时自动构建并部署

name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main

# 允许 GITHUB_TOKEN 修改 Pages 设置
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只能有一个部署任务运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 第一步：构建网站
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          submodules: true    # 拉取主题（PaperMod 是 submodule）
          fetch-depth: 0

      - name: 安装 Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: 构建网站
        run: hugo --minify

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # 第二步：部署到 GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
